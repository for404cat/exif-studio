[package]
name = "exif-studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["for404cat"]
description = "Local-first EXIF and video metadata workbench built with Rust and egui"
readme = "README.md"
homepage = "https://for404cat.github.io/exif-studio/"
repository = "https://github.com/for404cat/exif-studio"
license = "MIT"
keywords = ["exif", "metadata", "photo", "egui", "desktop"]
categories = ["multimedia::images", "gui"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
eframe = "0.37"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
kamadak-exif = "0.6"
little_exif = "0.6"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
